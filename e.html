<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCQ Quiz</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 20px;
            background-color: #f4f4f4;
            overflow: hidden;
            position: relative;
        }

        h2 {
            color: #2c3e50;
        }

        #quiz-container {
            max-width: 500px;
            margin: auto;
            padding: 20px;
            border: 2px solid #3498db;
            border-radius: 10px;
            background-color: white;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.2);
            position: relative;
            z-index: 10;
        }

        #question {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .option-button {
            display: block;
            width: 100%;
            margin: 5px 0;
            padding: 10px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            background-color: #ecf0f1;
            transition: 0.3s;
        }

        .option-button:hover {
            background-color: #bdc3c7;
        }

        .correct {
            background-color: #2ecc71 !important;
            color: white;
        }

        .incorrect {
            background-color: #e74c3c !important;
            color: white;
        }

        #score-container {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
            position: relative;
            z-index: 10;
        }

        /* Green Overlay Effect */
        #progress-overlay {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 0%;
            background: rgba(46, 204, 113, 0.7); /* Greenish overlay */
            transition: height 0.5s ease-in-out;
            z-index: 5;
        }

        .huge-celebration {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            color: gold;
            font-size: 50px;
            font-weight: bold;
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            z-index: 20;
        }

        #huge-celebration button {
            padding: 5px 10px;
            font-size: 16px;
            font-weight: bold;
            color: white;
            background-color: #3498db;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            outline: none;
            margin-top: 10px;
        }

        #huge-celebration button:hover {
            background-color: #2980b9;
            transform: scale(1.1);
        }

        #huge-celebration button:focus {
            box-shadow: 0 0 10px rgba(52, 152, 219, 0.7);
        }

        .more-button {
            background-color: #f39c12;
            color: white;
            padding: 5px 10px;
            font-size: 14px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }

        .more-button:hover {
            background-color: #e67e22;
        }
        #popup-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(128, 128, 128, 0.8); /* soft grey */
        z-index: 19;
        display: none;
  }
  #mistake-popup {
    display: none;
    position: fixed;
    top: 10%;
    left: 50%;
    transform: translateX(-50%);
    background: linear-gradient(135deg, #ffffff, #f9f9f9);
    padding: 25px;
    border-radius: 15px;
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
    z-index: 30;
    width: 90%;
    max-width: 550px;
    font-family: 'Segoe UI', sans-serif;
}

#mistake-popup h3 {
    color: #c0392b;
    font-size: 24px;
    margin-bottom: 20px;
    border-bottom: 2px dashed #e74c3c;
    padding-bottom: 10px;
}

#mistake-list {
    text-align: left;
    padding-left: 20px;
    max-height: 300px;
    overflow-y: auto;
    margin-bottom: 15px;
    font-size: 16px;
    line-height: 1.6;
    color: #2c3e50;
}

#mistake-list li {
    margin-bottom: 15px;
    padding: 12px;
    background: #fefefe;
    border-left: 4px solid #e74c3c;
    border-radius: 5px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.05);
}

#mistake-list li strong {
    color: #34495e;
}

#mistake-popup button {
    background: #3498db;
    color: white;
    padding: 12px 20px;
    font-size: 16px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.3s ease;
}

#mistake-popup button:hover {
    background: #2980b9;
}

    </style>
</head>
<body>

    <h2>Vocabulary MCQ Test(41-50)</h2>

    <div id="quiz-container">
        <p id="question"></p>
        <div id="options"></div>
        <button id="more-button" class="more-button" onclick="openDictionary()" style="display: none;">More</button>
    </div>

    <div id="score-container">Correct Answers: <span id="score">0</span></div>
    
    <div id="progress-overlay"></div>

    <div id="huge-celebration" class="huge-celebration">
        🎉 Congratulations! I am proud of you!🥳🎉  
        <button onclick="resetQuiz()">Start Again</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.3.3/dist/confetti.browser.min.js"></script>
    <script>
        const questions = [
    { question: "What is the synonym of 'Amiable'?", options: ["Friendly", "Hostile", "Cold", "Rude"], answer: "Friendly" },
    { question: "What is the antonym of 'Perpetual'?", options: ["Eternal", "Temporary", "Endless", "Constant"], answer: "Temporary" },
    { question: "What is the synonym of 'Annul'?", options: ["Validate", "Cancel", "Confirm", "Approve"], answer: "Cancel" },
    { question: "What is the antonym of 'Sporadic'?", options: ["Frequent", "Occasional", "Scattered", "Rare"], answer: "Frequent" },
    { question: "What is the synonym of 'Auspicious'?", options: ["Unfavorable", "Promising", "Ominous", "Discouraging"], answer: "Promising" },
    { question: "What is the antonym of 'Impromptu'?", options: ["Unplanned", "Prepared", "Spontaneous", "Sudden"], answer: "Prepared" },
    { question: "What is the synonym of 'Despotic'?", options: ["Tyrannical", "Democratic", "Lenient", "Fair"], answer: "Tyrannical" },
    { question: "What is the antonym of 'Permissive'?", options: ["Strict", "Lenient", "Easygoing", "Flexible"], answer: "Strict" },
    { question: "What is the synonym of 'Burgeon'?", options: ["Shrink", "Flourish", "Wither", "Decline"], answer: "Flourish" },
    { question: "What is the antonym of 'Hibernation'?", options: ["Dormancy", "Activity", "Sleep", "Rest"], answer: "Activity" }
];

        let score = 0;
        let askedQuestions = [];
        let currentWord = "";
        let mistakes = [];
        let totalAnswered = 0;

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                let j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function loadQuestion() {
            if (askedQuestions.length === questions.length) {
                askedQuestions = [];
                score = 0;
                document.getElementById("score").innerText = score;
                updateProgressOverlay();
            }

            let randomIndex;
            do {
                randomIndex = Math.floor(Math.random() * questions.length);
            } while (askedQuestions.includes(randomIndex));

            askedQuestions.push(randomIndex);
            const questionObj = questions[randomIndex];

            document.getElementById("question").innerText = questionObj.question;
            const optionsContainer = document.getElementById("options");
            optionsContainer.innerHTML = "";

            shuffleArray(questionObj.options);

            questionObj.options.forEach(option => {
                const button = document.createElement("button");
                button.className = "option-button";
                button.innerText = option;
                button.onclick = (e) => checkAnswer(e, button, questionObj.answer);
                optionsContainer.appendChild(button);
            });

            currentWord = questionObj.question.match(/'([^']+)'/)[1];
            document.getElementById("more-button").style.display = "block";
        }

        function checkAnswer(event, button, correctAnswer) {
    totalAnswered++;

    if (button.innerText === correctAnswer) {
        button.classList.add("correct");
        score++;
        document.getElementById("score").innerText = score;
        updateProgressOverlay();
        launchConfetti(event);
        if (score === questions.length) {
            showCelebration();
        }
    } else {
        button.classList.add("incorrect");
        mistakes.push({
            question: document.getElementById("question").innerText,
            correctAnswer: correctAnswer
        });

        document.body.style.transition = "background-color 0.5s ease-in-out";
        document.body.style.backgroundColor = "#e74c3c";
        setTimeout(() => {
            document.body.style.backgroundColor = "#f4f4f4";
        }, 500);
    }

    if (totalAnswered === questions.length) {
        setTimeout(() => {
            if (mistakes.length > 0) {
                showMistakePopup();
            }
        }, 1500);
    }

    setTimeout(loadQuestion, 1000);
}

        function updateProgressOverlay() {
            let progress = (score / questions.length) * 100;
            document.getElementById("progress-overlay").style.height = `${progress}%`;
        }

        function showCelebration() {
            document.getElementById("huge-celebration").style.display = "flex";
            for (let i = 0; i < 10; i++) {
                setTimeout(() => {
                    confetti({ particleCount: 150, spread: 80, startVelocity: 50 });
                }, i * 300);
            }
        }

        function resetQuiz() {
            mistakes = [];
            totalAnswered = 0;
            score = 0;
            askedQuestions = [];
            document.getElementById("score").innerText = score;
            document.getElementById("progress-overlay").style.height = "0%";
            document.getElementById("huge-celebration").style.display = "none";
            loadQuestion();
        }

        function launchConfetti(event) {
            confetti({ particleCount: 100, spread: 70 });
        }

       
        
    function openDictionary() {
        window.open(`https://dictionary.cambridge.org/dictionary/english/${currentWord}`, '_blank');
    }


        loadQuestion();
        function showMistakePopup() {
    const popup = document.getElementById("mistake-popup");
    const list = document.getElementById("mistake-list");
    const overlay = document.getElementById("popup-overlay");

    list.innerHTML = "";
    mistakes.forEach((m, i) => {
        const item = document.createElement("li");
        item.innerHTML = `<strong>Q${i + 1}:</strong> ${m.question}<br><strong>Correct Answer:</strong> ${m.correctAnswer}`;
        list.appendChild(item);
    });

    popup.style.display = "block";
    overlay.style.display = "block";  
}


function closeMistakePopup() {
    document.getElementById("mistake-popup").style.display = "none";
    document.getElementById("popup-overlay").style.display = "none"; 
}


    </script>
<div id="mistake-popup">
    <h3 >Review Your Mistakes</h3>
    <ul id="mistake-list" ></ul>
    <button onclick="closeMistakePopup()" >Close</button>
</div>
<div id="popup-overlay"></div>
</body>
</html>
